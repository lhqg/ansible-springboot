---
- name: "Install Java > 8"
  when: "( sbi_java_flavour != 'oracle' ) and ( sbi_java_version > 8 )"
  block:
    - name: "Install java"
      ansible.builtin.package:
        name: java-{{ sbi_java_version }}-{{ sbi_java_flavour }}-headless.x86_64
        state: present
      become: "{{ sbi_become }}"

    - name: "Create symlink to Java home"
      ansible.builtin.file:
        state: link
        dest: "{{ sbi_appbase }}/java_home"
        src: "/etc/alternatives/jre_{{ sbi_java_version }}_{{ sbi_java_flavour }}"
      become: "{{ sbi_become }}"

- name: "Install Java 8"
  when: "( sbi_java_flavour != 'oracle' ) and ( sbi_java_version == 8 )"
  block:
    - name: "Install java"
      ansible.builtin.package:
        name: java-1.{{ sbi_java_version }}.0-{{ sbi_java_flavour }}-headless.x86_64
        state: present
      become: "{{ sbi_become }}"

    - name: "Create symlink to Java home"
      ansible.builtin.file:
        state: link
        dest: "{{ sbi_appbase }}/java_home"
        src: "/etc/alternatives/jre_1.{{ sbi_java_version }}.0_{{ sbi_java_flavour }}"
      become: "{{ sbi_become }}"

...
