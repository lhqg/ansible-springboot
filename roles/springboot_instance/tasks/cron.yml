---
- name: "Install cron file to purge logs of Springboot {{ springboot_instance__appname }}"
  ansible.builtin.template:
    src: cron/springboot_purge-log_cronjob.j2
    dest: "/etc/cron.d/springboot_{{ springboot_instance__appname }}_jobs.cron"
    owner: root
    group: root
    mode: "0400"
    seuser: system_u
    serole: object_r
    setype: system_cron_spool_t
  become: "{{ springboot_instance__become }}"
  when: springboot_instance__log_dir_retention_days is defined and springboot_instance__log_dir_retention_days|int > 0

...
